name: Font check (temporary)

# One-off: proves Kannada text renders on the GitHub runner. Uses a local HTML page only,
# no secrets and no website. Deleted after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: Fonts before / after monitor font setup
        run: |
          echo "Kannada fonts before: $(fc-list ':lang=kn' family | wc -l)"
          python - <<'EOF'
          import os, sys
          os.environ.update(TELEGRAM_BOT_TOKEN="x", TELEGRAM_CHAT_ID="1", SITE_URL="http://localhost/")
          import monitor as m
          print("ensure_fonts() ->", m.ensure_fonts())
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              page = m.new_page(b)
              page.set_content("<meta charset=utf-8><h1 style='font-family:sans-serif'>ಸೌರ ಮಿತ್ರ ರೈತ ನೋಂದಣಿ</h1>")
              cdp = page.context.new_cdp_session(page)
              cdp.send("DOM.enable"); cdp.send("CSS.enable")
              root = cdp.send("DOM.getDocument")["root"]["nodeId"]
              h1 = cdp.send("DOM.querySelector", {"nodeId": root, "selector": "h1"})["nodeId"]
              fonts = cdp.send("CSS.getPlatformFontsForNode", {"nodeId": h1})["fonts"]
              print("fonts used:", [(f["familyName"], f["glyphCount"]) for f in fonts])
              png = page.screenshot()
              print("png bytes:", len(png))
              b.close()
              ok = any("Kannada" in f["familyName"] for f in fonts)
              print("KANNADA RENDERED:", ok)
              sys.exit(0 if ok else 1)
          EOF
