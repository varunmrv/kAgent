name: kAgent Monitor

# One long job (~5.5 h) that polls Telegram continuously and checks the website every
# 5 minutes. Before the 6 h GitHub limit it exits cleanly, saves state and starts the
# next run of itself. The watchdog workflow restarts the chain if that ever breaks.
on:
  workflow_dispatch:

# Only the workflow itself can use the secrets: there are no pull_request triggers,
# and secrets are never exposed to forks.
permissions:
  contents: write   # push the "state" branch
  actions: write    # start the next run

# Never two monitors at once. A newly dispatched run waits (it is not cancelled)
# until the current one finishes, so there is no gap and no double polling.
concurrency:
  group: kagent-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # RUN_SECONDS (5.5 h) + setup + hand-over, below the 6 h cap

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      RUN_SECONDS: "19800"           # 5 h 30 min of monitoring per run
      CHECK_INTERVAL_SECONDS: "300"  # website check every 5 minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          # No --with-deps: the ubuntu-24.04 runner already has Chromium's system
          # libraries, and the apt step only pulled optional fonts from a mirror
          # that can stall for minutes.
          python -m playwright install chromium

      - name: Restore state
        run: bash scripts/state_branch.sh pull

      - name: Run monitor
        run: |
          # Save state to the "state" branch every 20 minutes, so a crash or a
          # cancelled run loses at most 20 minutes of bookkeeping.
          ( while sleep 1200; do bash scripts/state_branch.sh push || true; done ) &
          saver=$!
          trap 'kill "$saver" 2>/dev/null || true' EXIT
          python -u monitor.py

      - name: Save state
        if: always()
        run: bash scripts/state_branch.sh push

      # Hand-over: start the next run (it queues until this one ends).
      # Skipped when someone cancelled the run on purpose, and after a failure the
      # watchdog restarts things within 10 minutes (avoids a tight crash loop).
      - name: Start next run
        if: success()
        run: bash scripts/ensure_monitor.sh handover

      - name: Alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 kAgent monitor run FAILED. The watchdog will restart it within ~10 minutes.
          ${RUN_URL}" >/dev/null || echo "could not send failure alert"
