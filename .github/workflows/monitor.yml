
name: Karnataka Soura Mitra Monitor

on:
  schedule:
    - cron: "17,32,47 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: souramitra-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Notify monitoring started
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": (
                      "🟢 SOURA MITRA MONITOR STARTED\n\n"
                      "Website: https://souramitra.com/\n"
                      "Monitoring: Farmer Registration\n"
                      "Frequency: Every hour\n"
                      "Commands: /status, /check, /help"
                  )
              },
              timeout=20
          )

          response.raise_for_status()

          if not response.json().get("ok"):
              raise RuntimeError("Telegram notification failed")
          PY

      - name: Run website monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save monitoring state
        if: always()
        run: |
          git config user.name "KUSUM Monitor"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || (
            git commit -m "Update Soura Mitra monitoring state"
            git push
          )

      - name: Notify Telegram about workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsS --max-time 20 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 SOURA MITRA MONITOR ERROR

